    '<div class="seg" role="group" style="flex-wrap:wrap">' + SUP_FILTERS.map(function (x) { return '<button type="button" data-supf="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + t(x[1]) + '</button>'; }).join('') + '</div>' +
    '<p class="small muted">' + t('מוצגים רק פרטי המרצים ומספרים כלליים. שמות ומיילים של משתלמים לא מוצגים כאן.') + '</p>' +
    (shown.length ? '<div class="stack">' + shown.map(lecturerRow).join('') + '</div>' : '<p class="muted">' + t('אין מרצים להצגה.') + '</p>') + '</div>';
  h += '<div class="card"><h3>' + t('הגדרות מנוי ותשלום') + '</h3>' +
    '<div class="field"><label for="supPay">' + t('פרטי התשלום שמוצגים למרצים (מחיר, Bit, מה כלול)') + '</label><textarea id="supPay" class="input" rows="6">' + esc(s.paymentText) + '</textarea></div>' +
    '<div class="grid3"><div class="field"><label for="supTrial">' + t('ימי ניסיון למרצה חדש') + '</label><input id="supTrial" class="input num" type="number" min="0" value="' + esc(s.trialDays) + '"></div>' +
    '<div class="field"><label for="supGrace">' + t('ימי גישה למשתלמים אחרי שהמנוי פג') + '</label><input id="supGrace" class="input num" type="number" min="0" value="' + esc(s.graceDays) + '"></div>' +
    '<div class="field"><label for="supAi">' + t('ייבואי AI בחודש למרצה בלי מפתח אישי') + '</label><input id="supAi" class="input num" type="number" min="0" value="' + esc(s.aiMonthlyLimit) + '"></div></div>' +
    '<button type="button" class="btn primary" id="supSave" style="justify-self:start">' + t('שמירת ההגדרות') + '</button></div>';
  return h;
}
function lecturerRow(L) {
  var until = L.status === 'trial' ? t('ניסיון עד {d}', { d: fmtStamp(L.trialEnd) }) : L.paidUntil ? t('בתוקף עד {d}', { d: fmtDate(L.paidUntil) }) : t('לא שילם/ה עדיין');
  return '<div class="lec-row' + (L.payClaimed ? ' claimed' : '') + '"><div class="lec-main"><div class="row" style="gap:6px"><b>' + esc(L.name) + '</b> ' + lecStatusChip(L) +
    (L.payClaimed ? ' <span class="chip async">' + esc(t('סימן/ה ששילם/ה ב-{d}', { d: fmtStamp(L.payClaimed) })) + '</span>' : '') + '</div>' +
    '<span class="small muted" dir="ltr" style="user-select:all">' + esc(L.email) + '</span>' +
    '<span class="small muted">' + esc(until) + ' · ' + esc(t('{g} קבוצות, {p} משתלמים', { g: L.groups, p: L.participants })) + (L.lastLogin ? ' · ' + esc(t('כניסה אחרונה {d}', { d: fmtStamp(L.lastLogin) })) : '') + '</span></div>' +
    '<div class="lec-acts row"><label class="sr-only" for="per_' + esc(L.id) + '">' + t('תקופה') + '</label><select class="input" id="per_' + esc(L.id) + '" style="width:auto">' +
    [[1, 'חודש'], [2, 'חודשיים'], [3, '3 חודשים'], [6, 'חצי שנה'], [12, 'שנה'], ['date', 'עד תאריך…']].map(function (x) { return '<option value="' + x[0] + '">' + t(x[1]) + '</option>'; }).join('') + '</select>' +
    '<input type="date" class="input" id="date_' + esc(L.id) + '" style="width:auto" hidden aria-label="' + esc(t('עד תאריך')) + '">' +
    '<button type="button" class="btn sm primary" data-approve="' + esc(L.id) + '">' + ICON.check + (L.payClaimed ? t('אישור תשלום') : t('הפעלה / הארכה')) + '</button>' +
    (L.status === 'blocked' ? '<button type="button" class="btn sm" data-unblock="' + esc(L.id) + '">' + t('ביטול חסימה') + '</button>' : '<button type="button" class="btn sm danger" data-block="' + esc(L.id) + '">' + t('חסימה') + '</button>') +
    '</div></div>';
}
function bindSuper() {
  var v = adminView();
  if (!A.sup) { loadSuper(); return; }
  function upd(payload, okMsg) { return adminCall('superUpdate', payload).then(function (d) { A.sup = d; renderAdmin(true); toast(okMsg); }).catch(adminErr); }
  $all('[data-supf]', v).forEach(function (b) { b.onclick = function () { A.supFilter = b.getAttribute('data-supf'); renderAdmin(true); }; });
  var fi = $('#supFind');
  if (fi) fi.oninput = function () { A.supFind = fi.value; var pos = fi.selectionStart; renderAdmin(true); var f2 = $('#supFind'); f2.focus(); try { f2.setSelectionRange(pos, pos); } catch (e) { /* ignore */ } };
  $all('select[id^="per_"]', v).forEach(function (sel) { sel.onchange = function () { $('#date_' + sel.id.slice(4)).hidden = sel.value !== 'date'; }; });
  $all('[data-approve]', v).forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-approve'), per = $('#per_' + id).value, L = A.sup.lecturers.filter(function (x) { return x.id === id; })[0];
      var payload = { lecturerId: id, op: 'approve' };
      if (per === 'date') { var dv = $('#date_' + id).value; if (!dv) { toast(t('בחרו תאריך')); return; } payload.until = dv; } else payload.months = Number(per);
      confirmDialog(t('להפעיל את החשבון של {n}?', { n: L.name }), t('אישור')).then(function (ok) { if (ok) upd(payload, t('החשבון הופעל')); });
    };
  });
  $all('[data-block]', v).forEach(function (b) {
    b.onclick = function () {
      var id = b.getAttribute('data-block'), L = A.sup.lecturers.filter(function (x) { return x.id === id; })[0];
      confirmDialog(t('לחסום את {n}? גם המשתלמים שלו/ה לא יוכלו להיכנס.', { n: L.name }), t('חסימה'), true).then(function (ok) { if (ok) upd({ lecturerId: id, op: 'block' }, t('החשבון נחסם')); });
    };
  });
  $all('[data-unblock]', v).forEach(function (b) { b.onclick = function () { upd({ lecturerId: b.getAttribute('data-unblock'), op: 'unblock' }, t('החסימה בוטלה')); }; });
  var sv = $('#supSave');
  if (sv) sv.onclick = function () {
    adminCall('superSettings', { settings: { paymentText: $('#supPay').value, trialDays: $('#supTrial').value, graceDays: $('#supGrace').value, aiMonthlyLimit: $('#supAi').value } })
      .then(function (d) { A.sup = d; renderAdmin(true); toast(t('ההגדרות נשמרו')); }).catch(adminErr);
  };
}

/* ---------- אתחול ---------- */
function boot() {
  applyLangAttrs();
  if (DEMO) initDemo();
  renderDemoBar();
  onLangChange.push(function () {
    renderDemoBar();
    if (!$('#adminView').hidden) { if (A.me && (A.me.status === 'active' || A.me.status === 'trial')) renderAdmin(true); else if (A.me) renderInactive(); }
    else if (!$('#appView').hidden && S.state) renderApp();
    else renderLogin();
  });
  $('#btnSyllabus').onclick = function () { openSyllabus(); };
  var lec = lsGet('lec'), sess = lsGet('session');
  var wantsGroup = new URLSearchParams(location.search).get('group');
  if (lec && lec.lecToken && !wantsGroup) { A.lec = lec; openLecturerArea(); }
  else if (sess && sess.token) { S.session = sess; enterApp(); }
  else showLogin();
}
function renderDemoBar() {
  var bar = $('#demoBar');
  if (!DEMO) { bar.hidden = true; return; }
  bar.hidden = false;
  bar.innerHTML = '<span><b>' + t('מצב הדגמה.') + '</b><span class="long"> ' + t('הנתונים נשמרים רק בדפדפן הזה, ומיילים לא נשלחים באמת.') + '</span></span><button type="button" id="demoReset">' + t('איפוס נתוני ההדגמה') + '</button>';
  $('#demoReset').onclick = function () {
    confirmDialog(t('לאפס את כל נתוני ההדגמה ולהתחיל מחדש?'), t('איפוס'), true).then(function (ok) {
      if (!ok) return;
      lsDel('db'); lsDel('session'); lsDel('lec'); lsDel('lastGroup'); location.reload();
    });
  };
}

boot();
})();
</script>

</body>
</html>
