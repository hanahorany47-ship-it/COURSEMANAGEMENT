<title>Course-Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&family=Suez+One&family=Tajawal:wght@400;500;700;800&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
/* Layout: מפת מסע אנכית (תחנה 1 למטה, מטלת הסיום בפסגה), סרגל עליון ותחתון, חלוניות כ-bottom sheet בנייד */
:root {
  --bg: #EEF0F4;
  --panel: #FFFFFF;
  --panel-2: #F6F7FA;
  --fg: #172033;
  --muted: #5B6477;
  --line: #D8DCE5;
  --accent: #0E7C77;
  --accent-fg: #FFFFFF;
  --accent-soft: #D7EFEC;
  --gold: #C98A0C;
  --gold-soft: #FBEFD3;
  --ok: #23874F;
  --ok-soft: #DDF2E5;
  --bad: #C6402F;
  --bad-soft: #F9E1DD;
  --lock: #8790A2;
  --lock-soft: #E7E9EE;
  --shadow: 0 10px 30px rgba(23, 32, 51, .14);
  --f-display: "Suez One", "Noto Kufi Arabic", "Frank Ruhl Libre", Georgia, serif;
  --f-body: "Assistant", "Tajawal", "Segoe UI", Arial, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F131C; --panel: #181E2B; --panel-2: #1F2636; --fg: #E7EAF1; --muted: #9AA3B6; --line: #2C3447;
    --accent: #3FC3BA; --accent-fg: #0B1A19; --accent-soft: #163634; --gold: #F0BE4C; --gold-soft: #3A2F14;
    --ok: #4CC47E; --ok-soft: #173525; --bad: #F07A68; --bad-soft: #3E1D19; --lock: #7D869A; --lock-soft: #262D3D;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F131C; --panel: #181E2B; --panel-2: #1F2636; --fg: #E7EAF1; --muted: #9AA3B6; --line: #2C3447;
  --accent: #3FC3BA; --accent-fg: #0B1A19; --accent-soft: #163634; --gold: #F0BE4C; --gold-soft: #3A2F14;
  --ok: #4CC47E; --ok-soft: #173525; --bad: #F07A68; --bad-soft: #3E1D19; --lock: #7D869A; --lock-soft: #262D3D;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45); color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55; margin: 0; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 400; line-height: 1.25; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- כפתורים ושדות ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 8px 18px;
  border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--fg); }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #1d1404; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--panel-2); }
.btn.sm { min-height: 34px; padding: 4px 12px; font-size: 14px; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn svg { width: 18px; height: 18px; flex: none; }
.field { display: grid; gap: 6px; }
.field > label, .lbl { font-weight: 600; font-size: 14px; }
.input, select.input, textarea.input { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
textarea.input { min-height: 88px; resize: vertical; line-height: 1.5; }
.input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.input[dir="ltr"] { text-align: left; }
.err { color: var(--bad); font-weight: 600; font-size: 14px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 700; background: var(--panel-2); color: var(--muted); white-space: nowrap; }
.chip.async { background: var(--gold-soft); color: var(--gold); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.lock { background: var(--lock-soft); color: var(--lock); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.stack { display: grid; gap: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }

/* ---------- סרגל הדגמה ---------- */
.demobar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--gold-soft); color: var(--fg);
  padding: 6px 16px; font-size: 14px; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.demobar b { color: var(--gold); }
@media (max-width: 560px) { .demobar .long { display: none; } }
.demobar button { background: none; border: 0; text-decoration: underline; cursor: pointer; color: var(--fg); font-size: 14px; }

/* ---------- מסך כניסה ---------- */
.login { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
.login-card { width: min(440px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 32px 28px; box-shadow: var(--shadow); display: grid; gap: 18px; }
.login-card h1 { font-size: 30px; }
.login-mark { width: 64px; height: 64px; }
.login-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.hint { background: var(--panel-2); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--muted); }

/* ---------- סרגל עליון ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 8px 16px; display: flex; align-items: center; gap: 12px; }
.topbar .who { min-width: 0; flex: 1; display: grid; }
.topbar .who strong { font-family: var(--f-display); font-weight: 400; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .who span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .acts { display: flex; gap: 6px; align-items: center; }
.passport-count { background: var(--gold-soft); color: var(--gold); border-radius: 999px; padding: 0 8px; font-size: 13px; font-weight: 800; }
@media (max-width: 560px) { .topbar .lbl-hide { display: none; } .topbar .btn { padding: 8px 10px; } }

/* ---------- המפה ---------- */
.map { position: relative; overflow: hidden; min-height: calc(100vh - 60px); }
.map-bg { position: absolute; inset: 0; background: var(--m-bg); background-size: var(--m-bg-size, cover); background-position: center; }
.map-inner { position: relative; max-width: 760px; margin: 0 auto; padding-inline: 16px; }
.map svg.path { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.map .trail { fill: none; stroke: var(--m-path); stroke-width: var(--m-w, 5); stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: var(--m-dash, none); opacity: .55; }
.map .trail.done { stroke: var(--m-done); opacity: 1; }
.map .deco { fill: var(--m-deco); }
.map .floor { stroke: var(--m-deco-line); stroke-width: 1; }

.node { position: absolute; transform: translate(-50%, -50%); width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center;
  background: var(--m-node-bg); color: var(--m-node-fg); border: 4px solid var(--m-node-ring); font-family: var(--f-display); font-size: 22px;
  cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.25); transition: transform .2s; z-index: 2; padding: 0; }
.node:hover { transform: translate(-50%, -50%) scale(1.08); }
.node.locked { background: var(--m-lock-bg); color: var(--m-lock-fg); border-color: var(--m-lock-ring); box-shadow: none; }
.node.done { background: var(--m-done); border-color: var(--m-node-ring); color: var(--m-done-fg); }
.node svg { width: 24px; height: 24px; }
.node .mini { position: absolute; bottom: -4px; inset-inline-end: -6px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  background: var(--m-lock-bg); color: var(--m-lock-fg); border: 2px solid var(--m-node-ring); }
.node .mini svg { width: 13px; height: 13px; }
.node .medal { background: #F0BE4C; color: #4A3205; }
.node.current::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--m-done); animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(.85); opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .node.current::after { animation: none; opacity: .7; } .node { transition: none; } }

.label { position: absolute; transform: translateY(-50%); background: var(--m-label-bg); color: var(--m-label-fg); border-radius: 12px; padding: 8px 12px;
  max-width: min(250px, calc(50% - 50px)); box-shadow: 0 4px 14px rgba(0,0,0,.18); cursor: pointer; border: 0; text-align: start; z-index: 1; }
.label .t { font-weight: 700; font-size: 14px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.label .m { font-size: 12px; color: var(--m-label-muted); display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.label .m .st { font-weight: 700; }
.label.locked .t { opacity: .75; }

.summit { position: absolute; transform: translate(-50%, -50%); z-index: 3; display: inline-flex; align-items: center; gap: 10px;
  background: var(--m-summit-bg); color: var(--m-summit-fg); border: 3px solid var(--m-summit-ring); border-radius: 999px; padding: 10px 22px;
  font-family: var(--f-display); font-size: 20px; cursor: pointer; box-shadow: 0 10px 26px rgba(0,0,0,.3); white-space: nowrap; }
.summit svg { width: 24px; height: 24px; }
.summit:hover { filter: brightness(1.05); }
@media (max-width: 420px) { .summit { font-size: 17px; padding: 8px 16px; } .node { width: 50px; height: 50px; font-size: 19px; } .label { max-width: calc(50% - 40px); padding: 6px 9px; } }

.bottombar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 20; display: flex; justify-content: center; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
  background: linear-gradient(to top, var(--bg) 40%, transparent); pointer-events: none; }
.bottombar .btn { pointer-events: auto; box-shadow: var(--shadow); min-height: 50px; padding-inline: 26px; font-size: 17px; }

/* ערכות נושא – כל אחת עולם ויזואלי קבוע */
.theme-space {
  --m-bg: radial-gradient(1.2px 1.2px at 12% 18%, #fff 50%, transparent 51%), radial-gradient(1px 1px at 68% 42%, #fff 50%, transparent 51%),
    radial-gradient(1.4px 1.4px at 33% 77%, #cfe9ff 50%, transparent 51%), radial-gradient(1px 1px at 86% 85%, #fff 50%, transparent 51%),
    radial-gradient(1px 1px at 50% 8%, #fff 50%, transparent 51%), radial-gradient(1.2px 1.2px at 92% 22%, #ffe9c4 50%, transparent 51%),
    radial-gradient(ellipse at 20% 30%, rgba(124, 77, 255, .35), transparent 55%), radial-gradient(ellipse at 85% 70%, rgba(0, 196, 204, .25), transparent 55%),
    linear-gradient(180deg, #070A1F 0%, #101A44 60%, #1B1240 100%);
  --m-bg-size: 220px 220px, 180px 180px, 260px 260px, 200px 200px, 240px 240px, 300px 300px, 100% 100%, 100% 100%, 100% 100%;
  --m-path: #8BB8FF; --m-done: #5CE1E6; --m-dash: 2 10; --m-w: 4;
  --m-node-bg: radial-gradient(circle at 35% 30%, #7FE7EC, #1B6E9E 70%); --m-node-fg: #fff; --m-node-ring: #CFF6FF;
  --m-lock-bg: #252B4A; --m-lock-fg: #8D95BC; --m-lock-ring: #3A4370; --m-done-fg: #06283A;
  --m-label-bg: rgba(14, 18, 48, .86); --m-label-fg: #EEF2FF; --m-label-muted: #A9B2DB;
  --m-summit-bg: #F0BE4C; --m-summit-fg: #2A1A00; --m-summit-ring: #FFE6A8; --m-deco: rgba(255,255,255,.06); --m-deco-line: transparent;
}
.theme-citadel {
  --m-bg: linear-gradient(180deg, #1E1330 0%, #43244E 35%, #8C4A5C 70%, #DB9358 100%);
  --m-path: #E8C27A; --m-done: #FFD782; --m-dash: none; --m-w: 6;
  --m-node-bg: #3B2240; --m-node-fg: #FFE3A6; --m-node-ring: #E8C27A;
  --m-lock-bg: #2A1E33; --m-lock-fg: #8F7C96; --m-lock-ring: #4E3A58; --m-done-fg: #3B2240;
  --m-label-bg: #F7EBD5; --m-label-fg: #3A2433; --m-label-muted: #7C5E66;
  --m-summit-bg: #FFD782; --m-summit-fg: #3A2433; --m-summit-ring: #FFF2CC; --m-deco: rgba(20, 8, 30, .35); --m-deco-line: rgba(232, 194, 122, .28);
}
.theme-mountain {
  --m-bg: linear-gradient(180deg, #BFDDF0 0%, #E3EEF2 45%, #F4EEDD 100%);
  --m-path: #8A5A2B; --m-done: #2F7D4F; --m-dash: 8 9; --m-w: 4;
  --m-node-bg: #FFFFFF; --m-node-fg: #1F4B33; --m-node-ring: #2F7D4F;
  --m-lock-bg: #E4E7E5; --m-lock-fg: #8C9690; --m-lock-ring: #BCC4BF; --m-done-fg: #FFFFFF;
  --m-label-bg: #FFFFFF; --m-label-fg: #23313A; --m-label-muted: #5D6B66;
  --m-summit-bg: #C8452F; --m-summit-fg: #FFFFFF; --m-summit-ring: #FFFFFF; --m-deco: rgba(84, 110, 122, .16); --m-deco-line: transparent;
}
.theme-metro {
  --m-bg: linear-gradient(rgba(30,30,30,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(30,30,30,.05) 1px, transparent 1px), #F3F3EE;
  --m-bg-size: 28px 28px, 28px 28px, 100% 100%;
  --m-path: #E5432F; --m-done: #E5432F; --m-dash: none; --m-w: 9;
  --m-node-bg: #FFFFFF; --m-node-fg: #1E1E1E; --m-node-ring: #1E1E1E;
  --m-lock-bg: #FFFFFF; --m-lock-fg: #A0A0A0; --m-lock-ring: #BDBDBD; --m-done-fg: #FFFFFF;
  --m-label-bg: #FFFFFF; --m-label-fg: #1E1E1E; --m-label-muted: #666;
  --m-summit-bg: #1E1E1E; --m-summit-fg: #FFFFFF; --m-summit-ring: #E5432F; --m-deco: transparent; --m-deco-line: transparent;
}
.theme-metro .trail { opacity: .25; }
.theme-metro .trail.done { opacity: 1; }
.theme-custom {
  --m-path: #FFFFFF; --m-done: #FFD782; --m-dash: 3 9; --m-w: 4;
  --m-node-bg: #FFFFFF; --m-node-fg: #172033; --m-node-ring: #FFD782;
  --m-lock-bg: rgba(30,30,40,.75); --m-lock-fg: #C9CCD6; --m-lock-ring: rgba(255,255,255,.5); --m-done-fg: #2A1A00;
  --m-label-bg: rgba(15, 18, 28, .82); --m-label-fg: #FFFFFF; --m-label-muted: #C9CCD6;
  --m-summit-bg: #FFD782; --m-summit-fg: #2A1A00; --m-summit-ring: #FFFFFF; --m-deco: transparent; --m-deco-line: transparent;
}

/* ---------- חלוניות ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 12, 22, .55); display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.modal { background: var(--panel); color: var(--fg); width: min(720px, 100%); max-height: calc(100vh - 48px); overflow: auto; border-radius: 20px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; }
.modal.wide { width: min(960px, 100%); }
.modal-head { position: sticky; top: 0; background: var(--panel); padding: 18px 22px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; z-index: 2; }
.modal-head h2 { font-size: 23px; flex: 1; min-width: 0; }
.modal-head .x { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--panel-2); cursor: pointer; display: grid; place-items: center; }
.modal-head .x svg { width: 18px; height: 18px; }
.modal-body { padding: 18px 22px 26px; display: grid; gap: 22px; }
.modal-body section { display: grid; gap: 10px; }
.modal-body h3 { font-size: 18px; }
@media (max-width: 600px) {
  .overlay { align-items: flex-end; padding: 0; }
  .modal { border-radius: 20px 20px 0 0; max-height: 92vh; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .modal-head, .modal-body { padding-inline: 16px; }
}
.st-eyebrow { font-size: 13px; color: var(--muted); font-weight: 700; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.req-list { margin: 0; padding-inline-start: 22px; display: grid; gap: 6px; }
.items { display: grid; gap: 8px; }
.item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2); flex-wrap: wrap; }
.item .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.item .ic svg { width: 20px; height: 20px; }
.item .tx { flex: 1; min-width: 140px; }
.item .tx b { display: block; }
.item .tx span { font-size: 13px; color: var(--muted); }
.embed { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 0; border-radius: 10px; background: #000; }
.box { border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; background: var(--panel); }
.box.okbox { border-color: var(--ok); background: var(--ok-soft); }
.lockbox { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: 14px; background: var(--lock-soft); color: var(--fg); }
.lockbox svg { width: 34px; height: 34px; color: var(--lock); flex: none; }

/* שאלון */
.quiz-q { display: grid; gap: 8px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; }
.quiz-q.right { border-color: var(--ok); background: var(--ok-soft); }
.quiz-q.wrong { border-color: var(--bad); background: var(--bad-soft); }
.quiz-q legend { font-weight: 700; padding: 0; }
.quiz-opt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.quiz-opt:hover { background: var(--panel-2); }
.quiz-opt input { width: 18px; height: 18px; accent-color: var(--accent); }
.score-ring { font-family: var(--f-display); font-size: 40px; line-height: 1; }

/* דירוג */
.rate { display: grid; gap: 10px; }
.rate-scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; direction: ltr; }
.rate-scale button { min-height: 42px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; font-weight: 800; font-variant-numeric: tabular-nums; padding: 0; }
.rate-scale button:hover, .rate-scale button.on { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

/* מאגר נתונים בזיכרון הדפדפן – משמש את מצב ההדגמה בלבד */
function MemStore(data, persist) {
  data.lecturers = data.lecturers || [];
  data.codes = data.codes || [];
  function list(bucket, gid) { return (data[bucket][gid] = data[bucket][gid] || []); }
  function upsert(arr, row, keys) {
    var i = arr.findIndex(function (r) { return keys.every(function (k) { return r[k] === row[k]; }); });
    if (i >= 0) arr[i] = row; else arr.push(row);
    persist();
  }
  var copy = function (o) { return JSON.parse(JSON.stringify(o)); };
  return {
    listGroups: function () { return Object.keys(data.groups).map(function (k) { return copy(data.groups[k]); }); },
    getGroup: function (id) { return data.groups[id] ? copy(data.groups[id]) : null; },
    saveGroup: function (g) { data.groups[g.id] = copy(g); persist(); },
    deleteGroup: function (id) {
      delete data.groups[id];
      ['roster', 'subs', 'quiz', 'ratings'].forEach(function (b) { delete data[b][id]; });
      persist();
    },
    getRoster: function (gid) { return copy(list('roster', gid)); },
    saveRoster: function (gid, rows) { data.roster[gid] = copy(rows); persist(); },
    getSubs: function (gid) { return copy(list('subs', gid)); },
    putSub: function (gid, row) { upsert(list('subs', gid), row, ['email', 'stationId']); },
    getQuizResults: function (gid) { return copy(list('quiz', gid)); },
    putQuizResult: function (gid, row) { upsert(list('quiz', gid), row, ['email', 'stationId']); },
    getRatings: function (gid) { return copy(list('ratings', gid)); },
    putRating: function (gid, row) { upsert(list('ratings', gid), row, ['stationId', 'voter']); },
    listTemplates: function () { return copy(data.templates); },
    saveTemplate: function (t) { data.templates.push(copy(t)); persist(); },
    deleteTemplate: function (id) { data.templates = data.templates.filter(function (t) { return t.id !== id; }); persist(); },
    getSetting: function (k) { return data.settings[k]; },
    setSetting: function (k, v) { data.settings[k] = v; persist(); },
    getLecturers: function () { return copy(data.lecturers); },
    saveLecturer: function (L) { upsert(data.lecturers, copy(L), ['id']); },
    getCode: function (email, purpose) { var r = data.codes.filter(function (c) { return c.email === email && c.purpose === purpose; })[0]; return r ? copy(r) : null; },
    saveCode: function (row) { upsert(data.codes, copy(row), ['email', 'purpose']); },
    deleteCode: function (email, purpose) { data.codes = data.codes.filter(function (c) { return !(c.email === email && c.purpose === purpose); }); persist(); }
  };
}

    for (var i = 0; i < 170; i++) {

})();

function xFor(theme, i, n) {

    case 'mountain': { var amp = 30 * (1 - i / Math.max(n, 1)) + 6; return 50 + (i % 2 ? amp : -amp); }

var LAYOUT = { top: 150, step: 132, bottom: 90 };

  var summit = { x: 50, y: LAYOUT.top / 2 + 6 };
  var all = pts.concat([summit]);
  var straight = theme === 'citadel' || theme === 'metro';
  function pathD(arr) {

          d += ' L' + a.x + ' ' + (mid + 22) + ' L' + b.x + ' ' + (mid - 22) + ' L' + b.x + ' ' + b.y;
        } else if (theme === 'citadel') {
          d += ' L' + a.x + ' ' + ((a.y + b.y) / 2) + ' L' + b.x + ' ' + ((a.y + b.y) / 2) + ' L' + b.x + ' ' + b.y;
        } else d += ' L' + b.x + ' ' + b.y;
      } else {
        var my = (a.y + b.y) / 2;

      }

  var deco = '';

    deco = '<polygon class="deco" points="-10,' + H + ' 50,' + (summit.y + 40) + ' 110,' + H + '"/>' +
      '<polygon class="deco" points="-30,' + H + ' 12,' + (H * 0.45) + ' 52,' + H + '"/><polygon class="deco" points="55,' + H + ' 92,' + (H * 0.55) + ' 130,' + H + '"/>';
  } else if (theme === 'citadel') {
    deco = '<rect class="deco" x="14" y="' + (summit.y + 30) + '" width="72" height="' + H + '"/>';
    pts.forEach(function (p) { deco += '<line class="floor" x1="14" x2="86" y1="' + (p.y + LAYOUT.step / 2) + '" y2="' + (p.y + LAYOUT.step / 2) + '" vector-effect="non-scaling-stroke"/>'; });
  }
  var html = '<svg class="path" viewBox="0 0 100 ' + H + '" preserveAspectRatio="none" aria-hidden="true">' + deco +
    '<path class="trail" d="' + pathD(all) + '" vector-effect="non-scaling-stroke"/>' +
    (donePts.length > 1 ? '<path class="trail done" d="' + pathD(donePts) + '" vector-effect="non-scaling-stroke"/>' : '') + '</svg>';
  html += '<button type="button" class="summit" id="summitBtn" style="left:' + summit.x + '%;top:' + summit.y + 'px">' + ICON.flag + esc(g.final.title || t('מטלת סיום ההשתלמות')) + '</button>';
  list.forEach(function (s, i) {
    var p = pts[i], status = stationStatus(s);
    var cls = 'node' + (status === 'locked' ? ' locked' : '') + (status === 'earned' || status === 'done' ? ' done' : '') + (i === lastOpen && status === 'open' ? ' current' : '');
    var content = status === 'locked' ? ICON.lock : String(i + 1);
    var mini = status === 'earned' ? '<span class="mini medal">' + ICON.star + '</span>' : status === 'done' ? '<span class="mini">' + ICON.check + '</span>' : '';
    var stText = status === 'locked' ? (s.mode === 'auto' && s.date ? t('נפתח ב-{d}', { d: fmtShort(s.date) }) : t('נעול'))
      : status === 'earned' ? t('הושלם, יש תג') : status === 'done' ? t('הוגש') : (s.hasTask && !s.mySub ? t('ממתין להגשה') : t('פתוח'));
    html += '<button type="button" class="' + cls + '" data-st="' + esc(s.id) + '" style="left:' + p.x + '%;top:' + p.y + 'px" aria-label="' + esc(t('תחנה {n}', { n: i + 1 }) + ': ' + s.title + '. ' + stText) + '">' + content + mini + '</button>';
    var side = p.x <= 50 ? 'left:calc(' + p.x + '% + 40px);max-width:min(250px, calc(' + (100 - p.x) + '% - 56px))' : 'right:calc(' + (100 - p.x) + '% + 40px);max-width:min(250px, calc(' + p.x + '% - 56px))';
    html += '<button type="button" class="label' + (status === 'locked' ? ' locked' : '') + '" data-st="' + esc(s.id) + '" style="top:' + p.y + 'px;' + side + '" tabindex="-1" aria-hidden="true">' +
      '<span class="t">' + esc(s.title) + '</span><span class="m"><span>' + esc(fmtShort(s.date)) + '</span>' + (s.type !== 'sync' ? '<span>' + esc(typeName(s.type)) + '</span>' : '') + '<span class="st">' + esc(stText) + '</span></span></button>';
  });
  var box = $('#mapInner');
  box.style.height = H + 'px';
  box.innerHTML = html;
  $all('[data-st]', box).forEach(function (b) { b.onclick = function () { openStation(b.getAttribute('data-st')); }; });
  $('#summitBtn').onclick = openFinal;
}

/* ---------- תחנה ---------- */
function findStation(id) { return S.state.stations.filter(function (s) { return s.id === id; })[0]; }
function openStation(id) {
  var s = findStation(id);
  if (!s) return;
  var m = modal({
    title: t('תחנה {n}', { n: s.index }) + ': ' + s.title,
    eyebrow: esc(fmtDate(s.date, true)) + (s.start ? ' · <span class="num">' + esc(s.start) + (s.end ? '–' + esc(s.end) : '') + '</span>' : '') +
      ' ' + typeChip(s.type) + (s.location ? ' <span class="chip">' + esc(s.location) + '</span>' : '') +
      (s.hours ? ' <span class="chip">' + esc(s.hours) + ' ' + t('ש"א') + '</span>' : '')
  });
  renderStationBody(m, id);
}
function renderStationBody(m, id) {
  var s = findStation(id), b = m.body, h = '';
  if (!s) { m.close(); return; }
  if (!s.open) {
    var when = s.mode === 'auto' && s.date ? t('התחנה תיפתח ב{d} בשעה {h}.', { d: fmtDate(s.date, true), h: S.state.group.openTime }) : t('המרצה עדיין לא פתח/ה את התחנה הזו.');
    h += '<div class="lockbox">' + ICON.lock + '<div><b>' + t('התחנה נעולה') + '</b><p class="small">' + esc(when) + '</p></div></div>';
    if (s.badge) h += '<p class="muted small">' + t('בתחנה זו אפשר לזכות בתג:') + ' <b>' + esc(s.badgeName || t('תג תחנה')) + '</b></p>';
    b.innerHTML = h;
    return;
  }
  if (s.desc) h += '<section><h3>' + t('על המפגש') + '</h3><p>' + esc(s.desc) + '</p></section>';
  if (s.requirements && s.requirements.length) {
    h += '<section><h3>' + t('דרישות המטלה') + '</h3><ol class="req-list">' + s.requirements.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ol></section>';
  }
  var items = (s.items || []).filter(function (it) { return JourneyCore.safeUrl(it.url); });
  if (items.length) {
    h += '<section><h3>' + t('חומרים וקישורים') + '</h3><div class="items">' + items.map(function (it) {
      var meta = ITEM_META[it.type] || ITEM_META.link, emb = embedUrl(it);
      return '<div class="item"><span class="ic">' + ICON[meta.icon] + '</span><div class="tx"><b>' + esc(it.title || t(meta.label)) + '</b><span>' + esc(t(meta.label)) + '</span></div>' +
        '<div class="row">' + (emb ? '<button type="button" class="btn sm" data-embed="' + esc(emb) + '">' + ICON.play + t('צפייה כאן') + '</button>' : '') +
        '<a class="btn sm" href="' + esc(safeHref(it.url)) + '" target="_blank" rel="noopener noreferrer">' + ICON.ext + t('פתיחה') + '</a></div></div>';
    }).join('') + '</div></section>';
  }
  if (s.hasTask) {
    var padlet = items.filter(function (it) { return it.type === 'padlet'; })[0];
    h += '<section><h3>' + t('הגשת תוצר') + '</h3>';
    if (s.mySub) {
      h += '<div class="box okbox"><div class="row"><span class="chip ok">' + ICON.check + ' ' + t('הוגש') + '</span><span class="small muted">' + esc(fmtStamp(s.mySub.time)) + '</span></div>' +
        '<a href="' + esc(safeHref(s.mySub.link)) + '" target="_blank" rel="noopener noreferrer" dir="ltr" style="word-break:break-all">' + esc(s.mySub.link) + '</a>' +
        '<button type="button" class="btn sm" id="reSub" style="justify-self:start">' + t('עדכון הקישור') + '</button></div>';
    }
    h += '<form class="box" id="subForm"' + (s.mySub ? ' hidden' : '') + ' novalidate>' +
      (padlet ? '<a class="btn gold" href="' + esc(safeHref(padlet.url)) + '" target="_blank" rel="noopener noreferrer" style="justify-self:start">' + ICON.padlet + t('הגש תוצר ב-Padlet') + '</a>' : '') +
      '<p class="small muted">' + esc(s.submitHint || (s.requirePadlet ? t('אחרי שהעליתם את התוצר ל-Padlet, העתיקו את הקישור לפוסט שלכם והדביקו אותו כאן.') : t('הדביקו כאן את הקישור לתוצר שלכם.'))) + '</p>' +
      '<div class="field"><label for="subLink">' + t('קישור לתוצר') + '</label><input id="subLink" class="input" type="url" dir="ltr" placeholder="' + (s.requirePadlet ? 'https://padlet.com/…' : 'https://…') + '" value="' + esc(s.mySub ? s.mySub.link : '') + '"></div>' +
      '<p class="err" id="subErr" role="alert" hidden></p>' +
      '<button class="btn primary" type="submit" style="justify-self:start">' + t('אישור הגשה') + '</button></form></section>';
  }
  if (s.quizCount) {
    var q = s.myQuiz;
    h += '<section><h3>' + t('שאלון התחנה') + '</h3><div class="box" id="quizBox"><div class="row" style="justify-content:space-between">' +
      '<div><b>' + t('{n} שאלות', { n: s.quizCount }) + '</b><p class="small muted">' + t('ציון עובר: {p}. אפשר לענות כמה פעמים, ונשמר הציון הגבוה.', { p: s.passScore }) + '</p></div>' +
      (q ? '<span class="chip ' + (q.best >= s.passScore ? 'ok' : 'bad') + '">' + t('הציון הגבוה: {b}', { b: q.best }) + '</span>' : '') + '</div>' +
      '<button type="button" class="btn primary" id="quizStart" style="justify-self:start">' + ICON.quiz + (q ? t('ניסיון נוסף') : t('התחלת השאלון')) + '</button></div></section>';
  }
  if (s.badge) {
    var need = [];
    if (s.hasTask && !s.mySub) need.push(t('להגיש את התוצר'));
    if (s.quizCount && !(s.myQuiz && s.myQuiz.best >= s.passScore)) need.push(t('לעבור את השאלון בציון {p} לפחות', { p: s.passScore }));
    h += '<section><div class="row" style="gap:14px;align-items:center">' + badgeSvg(s.index, s.earned, 56) +
      '<div style="flex:1;min-width:0"><b>' + esc(s.badgeName || t('תג תחנה {n}', { n: s.index })) + '</b><p class="small muted">' + (s.earned ? t('התג נוסף לדרכון שלך.') : esc(t('כדי לקבל את התג נשאר: {x}.', { x: need.join(t(' וגם ')) }))) + '</p></div></div></section>';
  }
  h += '<section><h3>' + t('איך היה המפגש?') + '</h3>' + ratingHtml(s.rating) + '</section>';
  b.innerHTML = h;

  $all('[data-embed]', b).forEach(function (btn) {
    btn.onclick = function () {
      var item = btn.closest('.item');
      if ($('iframe', item)) return;
      var f = document.createElement('iframe');
      f.className = 'embed'; f.src = btn.getAttribute('data-embed'); f.allow = 'autoplay; encrypted-media; fullscreen'; f.allowFullscreen = true;
      f.title = t('נגן וידאו'); f.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
      item.appendChild(f);
      btn.hidden = true;
    };
  });
  var re = $('#reSub', b);
  if (re) re.onclick = function () { $('#subForm', b).hidden = false; re.closest('.box').hidden = true; $('#subLink', b).focus(); };
  var form = $('#subForm', b);
  if (form) form.addEventListener('submit', function (e) {
    e.preventDefault();
    var link = $('#subLink', b).value.trim(), er = $('#subErr', b);
    er.hidden = true;
    if (!JourneyCore.safeUrl(link)) { er.hidden = false; er.textContent = t('זה לא נראה כמו קישור. העתיקו את הכתובת המלאה, שמתחילה ב-https://'); return; }
    var btn = $('button[type=submit]', form); btn.disabled = true; btn.textContent = t('שולח…');
    api('submit', Object.assign(authPayload(), { stationId: s.id, link: link })).then(function (st) {
      applyState(st);
      toast(t('ההגשה נקלטה'));
      renderStationBody(m, id);
    }).catch(function (err) {
      if (handleAuthError(err)) return;
      er.hidden = false; er.textContent = errMsg(err); btn.disabled = false; btn.textContent = t('אישור הגשה');
    });
  });
  var qs = $('#quizStart', b);
  if (qs) qs.onclick = function () { runQuiz(m, id); };
  bindRating(b, s);
}

function ratingHtml(r) {
  r = r || { dist: [], count: 0, avg: 0, mine: 0 };
  var max = Math.max.apply(null, r.dist.concat([1]));
  var bars = '', btns = '', xs = '';
  for (var i = 1; i <= 10; i++) {
    btns += '<button type="button" data-rate="' + i + '"' + (r.mine === i ? ' class="on" aria-pressed="true"' : ' aria-pressed="false"') + ' aria-label="' + esc(t('דירוג {n}', { n: i })) + '">' + i + '</button>';
    var c = r.dist[i - 1] || 0;
    bars += '<div style="height:' + Math.round((c / max) * 100) + '%"' + (r.mine === i ? ' class="mine"' : '') + ' title="' + esc(t('{c} הצבעות לציון {n}', { c: c, n: i })) + '"></div>';
    xs += '<span>' + i + '</span>';
  }
  return '<div class="rate' + (r.mine ? ' voted' : '') + '" id="rateBox"><div class="rate-scale" role="group" aria-label="' + esc(t('דירוג שביעות רצון מ-1 עד 10')) + '">' + btns + '</div>' +
    '<div class="rate-ends"><span>1 · ' + t('לא טוב') + '</span><span>' + t('מרוצה מאוד') + ' · 10</span></div>' +
    '<div class="rate-chart" aria-live="polite"><div class="row" style="justify-content:space-between"><b>' + t('ממוצע הכיתה:') + ' <span class="num">' + (r.count ? r.avg : '–') + '</span></b><span class="small muted num">' + t('{c} הצבעות', { c: r.count }) + '</span></div>' +
    '<div class="bars">' + bars + '</div><div class="bars-x">' + xs + '</div></div>' +
    '<p class="small muted">' + t('הדירוג אנונימי. אפשר לשנות אותו בכל עת.') + '</p></div>';
}
function bindRating(b, s) {
  $all('[data-rate]', b).forEach(function (btn) {
    btn.onclick = function () {
      api('rate', Object.assign(authPayload(), { stationId: s.id, value: Number(btn.getAttribute('data-rate')) })).then(function (stats) {
        s.rating = stats;
        var box = $('#rateBox', b), tmp = document.createElement('div');
        tmp.innerHTML = ratingHtml(stats);
        box.parentNode.replaceChild(tmp.firstChild, box);
        bindRating(b, s);
        toast(t('תודה על הדירוג'));
      }).catch(function (e) { if (!handleAuthError(e)) toast(errMsg(e)); });
    };
  });
}

function runQuiz(m, id) {
  var s = findStation(id), box = $('#quizBox', m.body);
  box.innerHTML = '<form id="quizForm" class="stack" novalidate>' + s.quiz.map(function (q, qi) {
    return '<fieldset class="quiz-q" data-q="' + qi + '"><legend>' + (qi + 1) + '. ' + esc(q.q) + '</legend>' + q.options.map(function (o, oi) {
      return '<label class="quiz-opt"><input type="radio" name="q' + qi + '" value="' + oi + '"> <span>' + esc(o) + '</span></label>';
    }).join('') + '</fieldset>';
  }).join('') + '<p class="err" id="qErr" role="alert" hidden></p><div class="row"><button class="btn primary" type="submit">' + t('בדיקת התשובות') + '</button><button type="button" class="btn" id="qCancel">' + t('ביטול') + '</button></div></form>';
  var f = $('#quizForm', box);
  $('#qCancel', box).onclick = function () { renderStationBody(m, id); };
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var answers = s.quiz.map(function (q, qi) { var c = $('input[name=q' + qi + ']:checked', f); return c ? Number(c.value) : -1; });
    var missing = answers.indexOf(-1);
    if (missing >= 0) { var er = $('#qErr', f); er.hidden = false; er.textContent = t('נשארה שאלה בלי תשובה (שאלה {n}).', { n: missing + 1 }); return; }
    var btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = t('בודק…');
    api('quizSubmit', Object.assign(authPayload(), { stationId: id, answers: answers })).then(function (res) {
      res.flags.forEach(function (ok, qi) {
        var fs = $('[data-q="' + qi + '"]', f);
        fs.classList.add(ok ? 'right' : 'wrong');
        var tag = document.createElement('span'); tag.className = 'chip ' + (ok ? 'ok' : 'bad'); tag.textContent = ok ? t('נכון') : t('לא נכון');
        fs.appendChild(tag);
        $all('input', fs).forEach(function (i) { i.disabled = true; });
      });
      var sum = document.createElement('div');
      sum.className = 'selfscore';
      sum.innerHTML = '<span class="big num">' + res.score + '</span><div><b>' + esc(t('{r} מתוך {n} נכונות', { r: res.right, n: res.total })) + '</b><p class="small">' +
        esc((res.passed ? t('עברת את השאלון.') : t('הציון העובר הוא {p}. אפשר לנסות שוב.', { p: s.passScore })) + ' ' + t('הציון הגבוה שלך: {b}', { b: res.best })) + '</p></div>';
      f.insertBefore(sum, f.firstChild);
      btn.hidden = true; $('#qCancel', f).textContent = t('חזרה לתחנה');
      sum.scrollIntoView({ block: 'nearest' });
      applyState(res.state);
    }).catch(function (err) {
      if (handleAuthError(err)) return;
      var er = $('#qErr', f); er.hidden = false; er.textContent = errMsg(err); btn.disabled = false; btn.textContent = t('בדיקת התשובות');
    });
  });
}

/* ---------- תגים ודרכון ---------- */
var BADGE_COLORS = ['#3FC3BA', '#7C4DFF', '#E5432F', '#2F7D4F', '#1B6E9E', '#C8452F', '#8A5A2B', '#B0368E', '#0E7C77', '#D4881B'];
function badgeSvg(index, on, size) {

  return '<svg viewBox="0 0 84 84" width="' + (size || 84) + '" height="' + (size || 84) + '" aria-hidden="true" style="flex:none' + (on ? '' : ';filter:grayscale(1);opacity:.5') + '">' +
    '<path d="M28 50 L20 80 L32 74 L38 82 L42 56Z" fill="' + c + '" opacity=".75"/><path d="M56 50 L64 80 L52 74 L46 82 L42 56Z" fill="' + c + '" opacity=".75"/>' +
    '<circle cx="42" cy="36" r="28" fill="#F0BE4C"/><circle cx="42" cy="36" r="22" fill="' + c + '"/>' +
    '<circle cx="42" cy="36" r="22" fill="none" stroke="#FFF3CF" stroke-width="2" stroke-dasharray="2 4"/>' +
    '<text x="42" y="44" text-anchor="middle" font-family="Suez One, Georgia, serif" font-size="24" fill="#FFFFFF">' + index + '</text></svg>';
}
function openPassport() {

  m.body.innerHTML = '<section><div class="row" style="justify-content:space-between"><b>' + t('אספת {e} מתוך {n} תגים', { e: earned, n: withBadge.length }) + '</b><span class="num muted">' + pct + '%</span></div>' +
    '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div style="width:' + pct + '%"></div></div></section>' +
    (withBadge.length ? '<div class="passport">' + withBadge.map(function (s) {

  h += '<section><h3>' + t('מפת המפגשים') + '</h3><div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>' + t('תאריך') + '</th><th>' + t('שעות') + '</th><th>' + t('סוג') + '</th>' + (hasLoc ? '<th>' + t('מיקום') + '</th>' : '') + '<th>' + t('נושא') + '</th><th>' + t('ש"א') + '</th></tr></thead><tbody>' +
    list.map(function (s) {
      return '<tr><td class="num">' + s.index + '</td><td class="num" style="white-space:nowrap">' + esc(fmtDate(s.date, true)) + '</td><td class="num" style="white-space:nowrap">' + esc(s.start) + (s.end ? '–' + esc(s.end) : '') + '</td>' +
        '<td>' + typeChip(s.type) + '</td>' + (hasLoc ? '<td>' + esc(s.location || '') + '</td>' : '') + '<td style="min-width:220px"><button type="button" class="btn ghost sm" data-st="' + esc(s.id) + '" style="text-align:start;justify-content:flex-start;padding-inline:0;min-height:0">' + esc(s.title) + '</button></td><td class="num">' + esc(s.hours || '') + '</td></tr>';

/* ---------- מטלת סיום ---------- */
function openFinal() {
  var g = S.state.group, f = g.final;
  var key = 'rubric.' + g.id + '.' + S.state.me.email;
  var checked = lsGet(key) || {};
  var m = modal({ title: f.title || t('מטלת סיום ההשתלמות'), wide: true, eyebrow: esc(t('פסגת המסע')) });
  var h = '';
  if (f.intro) h += '<section><p>' + esc(f.intro) + '</p></section>';
  if (f.sections.length) h += '<section><h3>' + t('מבנה העבודה') + '</h3>' + f.sections.map(function (s) {
    return '<div class="stack" style="gap:6px"><b>' + esc(s.title) + '</b><ul class="goal-list">' + s.items.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
  }).join('') + '</section>';
  if (f.rubric.length) {
    var total = f.rubric.reduce(function (a, r) { return a + r.points; }, 0);
    h += '<section><h3>' + t('מחוון ובדיקה עצמית') + '</h3><p class="small muted">' + t('סמנו כל רכיב שהשלמתם. הניקוד המשוער נשמר רק במכשיר שלכם, ואינו הציון הסופי.') + '</p>' +
      f.rubric.map(function (r, i) {
        return '<label class="rubric-row check"><span style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" data-rb="' + i + '"' + (checked[i] ? ' checked' : '') + '>' +
          '<span><b>' + esc(r.name) + '</b><br><span class="small muted">' + esc(r.desc) + '</span></span></span><span class="pts num">' + r.points + '</span></label>';
      }).join('') +
      '<div class="selfscore"><span class="big num" id="selfScore">0</span><span>' + t('מתוך {n} נקודות (הערכה עצמית)', { n: total }) + '</span></div></section>';
  }
  if (f.allowSubmit) {
    var fs = S.state.finalSub;
    h += '<section><h3>' + t('הגשת העבודה') + '</h3>' +
      (fs ? '<div class="box okbox"><div class="row"><span class="chip ok">' + ICON.check + ' ' + t('סימנת שהגשת') + '</span><span class="small muted">' + esc(fmtStamp(fs.time)) + '</span></div><a href="' + esc(safeHref(fs.link)) + '" target="_blank" rel="noopener noreferrer" dir="ltr" style="word-break:break-all">' + esc(fs.link) + '</a></div>' : '') +
      '<form class="box" id="finalForm" novalidate><div class="field"><label for="finalLink">' + t('קישור לקובץ העבודה (Drive או סביבת הלמידה)') + '</label><input id="finalLink" class="input" type="url" dir="ltr" placeholder="https://…" value="' + esc(fs ? fs.link : '') + '"></div>' +
      '<p class="err" id="finalErr" role="alert" hidden></p><button class="btn gold" type="submit" style="justify-self:start">' + ICON.flag + (fs ? t('עדכון הקישור') : t('הגשתי')) + '</button></form></section>';
  }
  m.body.innerHTML = h;
  function recalc() {
    var sum = 0;
    $all('[data-rb]', m.body).forEach(function (cb) { var i = +cb.getAttribute('data-rb'); checked[i] = cb.checked; if (cb.checked) sum += f.rubric[i].points; });
    var el = $('#selfScore', m.body); if (el) el.textContent = sum;
    lsSet(key, checked);
  }
  $all('[data-rb]', m.body).forEach(function (cb) { cb.onchange = recalc; });
  recalc();
  var form = $('#finalForm', m.body);
  if (form) form.addEventListener('submit', function (e) {
    e.preventDefault();
    var link = $('#finalLink', m.body).value.trim(), er = $('#finalErr', m.body);
    er.hidden = true;
    if (!JourneyCore.safeUrl(link)) { er.hidden = false; er.textContent = t('הדביקו קישור מלא, שמתחיל ב-https://'); return; }
    api('submit', Object.assign(authPayload(), { stationId: 'final', link: link })).then(function (st) {
      S.state = st; renderApp(); m.close(); confetti(); toast(t('כל הכבוד! ההגשה נרשמה.'));
    }).catch(function (err) { if (!handleAuthError(err)) { er.hidden = false; er.textContent = errMsg(err); } });
  });
}

var LG = { tab: 'student', step: 'group', group: null, email: '', pinMode: '', name: '', lecMode: 'login', lecEmail: '', msg: '' };

function showLogin(opts) {
  opts = opts || {};
  if (opts.tab) LG.tab = opts.tab;
  if (opts.lecMode) LG.lecMode = opts.lecMode;
  LG.msg = opts.message || '';
  $('#appView').hidden = true;
  $('#adminView').hidden = true;
  $('#loginView').hidden = false;
  document.body.style.overflow = '';
  if (LG.tab === 'student' && !LG.group) {
    var wanted = new URLSearchParams(location.search).get('group') || lsGet('lastGroup') || (DEMO ? 'demo' : '');
    if (wanted) {
      LG.step = 'loading';
      renderLogin();
      api('groupInfo', { groupId: wanted }).then(function (g) { LG.group = g; LG.step = 'email'; renderLogin(); })
        .catch(function () { LG.step = 'group'; renderLogin(); });
      return;
    }
    LG.step = 'group';
  }
  renderLogin();
}

function renderLogin() {
  var v = $('#loginView');

function bindStudent(v) {
  var fg = $('#fGroup', v);
  if (fg) fg.addEventListener('submit', function (e) {
    e.preventDefault();
    var code = $('#lgCode', v).value.trim();
    var m = code.match(/[?&]group=([^&#\s]+)/); if (m) code = decodeURIComponent(m[1]);
    if (!code) return loginErr(t('הקלידו את קוד הקבוצה.'));
    var b = $('button[type=submit]', fg); busy(b, true, t('בודק…'));
    api('groupInfo', { groupId: code }).then(function (g) { LG.group = g; LG.step = 'email'; LG.msg = ''; lsSet('lastGroup', g.id); renderLogin(); })
      .catch(function (err) { busy(b, false, t('המשך')); loginErr(err); });
  });
  var ch = $('#lgChange', v);
  if (ch) ch.onclick = function () { LG.group = null; LG.step = 'group'; lsDel('lastGroup'); LG.msg = ''; renderLogin(); };
  var fe = $('#fEmail', v);
  if (fe) fe.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = JourneyCore.normEmail($('#lgEmail', v).value);
    if (!JourneyCore.isEmail(email)) return loginErr(t('כתובת המייל לא תקינה. בדקו שאין רווחים ושיש בה @.'));
    var b = $('button[type=submit]', fe); busy(b, true, t('בודק…'));
    api('login', { groupId: LG.group.id, email: email }).then(function (r) {
      LG.email = email; LG.msg = '';
      if (r.token) return startSession(r);
      LG.pinMode = r.needPin; LG.name = r.name; LG.step = 'pin'; renderLogin();
    }).catch(function (err) { busy(b, false, t('המשך')); loginErr(err); });
  });
  var fp = $('#fPin', v);
  if (fp) fp.addEventListener('submit', function (e) {
    e.preventDefault();
    var pin = $('#lgPin', v).value.trim();
    if (!/^\d{4,8}$/.test(pin)) return loginErr(t('הקוד האישי צריך להיות 4 עד 8 ספרות.'));
    if (LG.pinMode === 'set' && pin !== $('#lgPin2', v).value.trim()) return loginErr(t('שני הקודים אינם זהים.'));
    var b = $('button[type=submit]', fp); busy(b, true, t('בודק…'));
    api('login', { groupId: LG.group.id, email: LG.email, pin: pin }).then(startSession)
      .catch(function (err) { busy(b, false, t('כניסה למסע')); loginErr(err); });
  });
  var bk = $('#lgBack', v);
  if (bk) bk.onclick = function () { LG.step = 'email'; LG.msg = ''; renderLogin(); };
}
function startSession(r) {
  S.session = { groupId: r.groupId, email: r.email, name: r.name, token: r.token };
  lsSet('session', S.session); lsSet('lastGroup', r.groupId);
  LG.step = 'email'; LG.msg = '';
  enterApp();
}

        '<div class="field"><label for="cdPw2">' + t('הקלדה חוזרת של הסיסמה') + '</label><input id="cdPw2" class="input" type="password" dir="ltr" autocomplete="new-password"></div>' : '') +

function bindLecturer(v) {
  $all('[data-mode]', v).forEach(function (b) { b.onclick = function () { LG.lecMode = b.getAttribute('data-mode'); LG.msg = ''; renderLogin(); }; });
  function done(r) { lecSaveSession(r); LG.lecMode = 'login'; openLecturerArea(); }
  var fl = $('#fLec', v);
  if (fl) fl.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = JourneyCore.normEmail($('#lcEmail', v).value), pw = $('#lcPw', v).value;
    if (!JourneyCore.isEmail(email) || !pw) return loginErr(t('מלאו מייל וסיסמה.'));
    var b = $('button[type=submit]', fl); busy(b, true, t('בודק…'));
    LG.lecEmail = email;
    api('lecLogin', { email: email, password: pw }).then(function (r) {
      if (r.needVerify) { LG.lecMode = 'verify'; LG.msg = ''; renderLogin(); return; }
      done(r);
    }).catch(function (err) { busy(b, false, t('כניסה')); loginErr(err); });
  });
  var fr = $('#fReg', v);
  if (fr) fr.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = $('#rgName', v).value.trim(), email = JourneyCore.normEmail($('#rgEmail', v).value), pw = $('#rgPw', v).value;
    if (!name) return loginErr(t('יש למלא שם מלא.'));
    if (!JourneyCore.isEmail(email)) return loginErr(t('כתובת המייל לא תקינה.'));
    if (pw.length < 8) return loginErr(t('הסיסמה צריכה לכלול לפחות 8 תווים.'));
    if (pw !== $('#rgPw2', v).value) return loginErr(t('שתי הסיסמאות אינן זהות.'));
    var b = $('button[type=submit]', fr); busy(b, true, t('שולח…'));
    api('lecRegister', { name: name, email: email, password: pw, lang: LANG }).then(function () {
      LG.lecEmail = email; LG.lecMode = 'verify'; LG.msg = ''; renderLogin();
    }).catch(function (err) { busy(b, false, t('הרשמה')); loginErr(err); });
  });
  var fc = $('#fCode', v);
  if (fc) {
    fc.addEventListener('submit', function (e) {
      e.preventDefault();
      var code = $('#cdCode', v).value.trim();
      if (!/^\d{6}$/.test(code)) return loginErr(t('הקוד צריך להיות 6 ספרות.'));
      var b = $('button[type=submit]', fc); busy(b, true, t('בודק…'));
      var p;
      if (LG.lecMode === 'reset') {
        var pw = $('#cdPw', v).value;
        if (pw.length < 8) { busy(b, false, t('שמירת הסיסמה')); return loginErr(t('הסיסמה צריכה לכלול לפחות 8 תווים.')); }
        if (pw !== $('#cdPw2', v).value) { busy(b, false, t('שמירת הסיסמה')); return loginErr(t('שתי הסיסמאות אינן זהות.')); }
        p = api('lecReset', { email: LG.lecEmail, code: code, password: pw });
      } else p = api('lecVerify', { email: LG.lecEmail, code: code });
      p.then(done).catch(function (err) { busy(b, false, LG.lecMode === 'reset' ? t('שמירת הסיסמה') : t('אימות')); loginErr(err); });
    });
    $('#cdResend', v).onclick = function () {
      api('lecResend', { email: LG.lecEmail, purpose: LG.lecMode === 'reset' ? 'reset' : 'verify' })
        .then(function () { toast(t('נשלח קוד חדש')); }).catch(loginErr);
    };
  }
  var ff = $('#fForgot', v);
  if (ff) ff.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = JourneyCore.normEmail($('#fgEmail', v).value);
    if (!JourneyCore.isEmail(email)) return loginErr(t('כתובת המייל לא תקינה.'));
    var b = $('button[type=submit]', ff); busy(b, true, t('שולח…'));
    api('lecForgot', { email: email }).then(function () {
      LG.lecEmail = email; LG.lecMode = 'reset'; LG.msg = ''; renderLogin();
    }).catch(function (err) { busy(b, false, t('שליחת קוד')); loginErr(err); });
  });
}

/* =====================================================================
   Course-Manager – אזור המרצה: חשבון, קבוצות, תחנות, משתלמים, מנהלת
   ===================================================================== */
var A = { lec: null, me: null, overview: null, gid: null, data: null, draft: null, dirty: false, tab: 'track', openSt: {}, poll: 0, rosterFilter: '', autoImport: false, sup: null, supFilter: 'all', supFind: '', payText: '' };
function adminView() { return $('#adminView'); }

/* ---------- סשן מרצה ---------- */
function lecSaveSession(r) {
  A.lec = { lecId: r.lecId, lecToken: r.lecToken };
  A.me = r.me;
  lsSet('lec', { lecId: r.lecId, lecToken: r.lecToken });
}
function lecPayload() { return A.lec || {}; }
function adminCall(action, payload) { return api(action, Object.assign({}, lecPayload(), payload || {})); }
function lecLogout(msg) {
  lsDel('lec'); A.lec = null; A.me = null; A.data = null; A.overview = null; A.dirty = false; A.sup = null;
  clearInterval(A.poll);
  modalStack.slice().forEach(function (m) { m.close(); });
  adminView().hidden = true; adminView().innerHTML = '';
  showLogin({ tab: 'lecturer', message: msg });
}
function adminErr(e) {
  if (e && e.code === 'LEC_AUTH') { lecLogout(errMsg(e)); return; }
  if (e && e.code === 'LEC_INACTIVE') { refreshMe().then(renderInactive); return; }
  toast(errMsg(e), 5000);
}
function refreshMe() {
  return adminCall('lecMe').then(function (r) { A.me = r.me; A.payText = r.paymentText; return r; });
}
function openLecturerArea() {
  $('#loginView').hidden = true; $('#appView').hidden = true;
  var v = adminView(); v.hidden = false;
  v.innerHTML = '<div class="spinner" role="status" aria-label="' + esc(t('טוען')) + '"></div>';
  refreshMe().then(function () {
    if (A.me.status === 'active' || A.me.status === 'trial') loadOverview();
    else renderInactive();
  }).catch(function (e) { if (e && e.code === 'LEC_AUTH') lecLogout(errMsg(e)); else { v.innerHTML = ''; toast(errMsg(e)); showLogin({ tab: 'lecturer' }); } });
}
function statusChip(me) {
  if (me.isSuper) return '<span class="chip accent">' + t('מנהלת האתר') + '</span>';
  if (me.status === 'trial') return '<span class="chip async">' + esc(t('ניסיון עד {d}', { d: fmtStamp(me.trialEnd) })) + '</span>';
  if (me.status === 'active') return '<span class="chip ok">' + esc(t('פעיל עד {d}', { d: fmtDate(me.paidUntil) })) + '</span>';
  if (me.status === 'blocked') return '<span class="chip bad">' + t('חסום') + '</span>';
  return '<span class="chip bad">' + t('פג תוקף') + '</span>';
}

/* ---------- חשבון שפג / חסום / תשלום ---------- */

    (claimed ? '<div class="box okbox"><b>' + esc(t('סימנת ששילמת ב-{d}.', { d: fmtStamp(claimed) })) + '</b><p class="small">' + t('החשבון ייפתח אחרי שהתשלום יאושר. בדרך כלל תוך יום עבודה.') + '</p></div>' : '') +

function bindPayment(root) {

  if (b) b.onclick = function () {
    b.disabled = true;
    adminCall('lecClaimPaid', { note: $('#payNote', root).value }).then(function (r) {
      A.me = r.me; toast(t('תודה! קיבלנו את ההודעה, והחשבון ייפתח אחרי האישור.'), 5000);

function renderInactive() {
  var v = adminView(), st = A.me.status;

    : t('תקופת השימוש בחשבון הסתיימה. כדי להמשיך לנהל קבוצות, יש לחדש את המנוי. המשתלמים שלך יכולים להמשיך להיכנס עוד זמן מה.');

/* ---------- טעינת קבוצות ---------- */
function loadOverview(selectId) {
  return adminCall('adminOverview').then(function (ov) {
    A.overview = ov; A.me = ov.me;
    var ids = ov.groups.map(function (g) { return g.id; });
    var want = selectId || A.gid || lsGet('adminGroup');
    A.gid = ids.indexOf(want) >= 0 ? want : (ids[0] || null);
    if (A.gid) return loadGroup(A.gid);
    A.data = null; A.draft = null; renderAdmin();
  }).catch(adminErr);
}
function loadGroup(gid) {
  A.gid = gid; lsSet('adminGroup', gid);
  return adminCall('adminGetGroup', { groupId: gid }).then(function (d) {
    A.data = d; A.draft = JourneyCore.clone(d.group); A.dirty = false;
    renderAdmin();
    clearInterval(A.poll);
    A.poll = setInterval(function () {
      if (document.hidden || A.dirty || A.tab !== 'track' || adminView().hidden) return;
      adminCall('adminGetGroup', { groupId: A.gid }).then(function (d2) { A.data = d2; A.draft = JourneyCore.clone(d2.group); renderAdmin(true); }).catch(function () { /* שקט */ });
    }, 30000);
  }).catch(adminErr);
}
function setDirty() { if (!A.dirty) { A.dirty = true; var sb = $('#saveBar'); if (sb) sb.hidden = false; } }

function tabsList() {
  var tabs = [['track', 'מעקב'], ['stations', 'תחנות ותוכן'], ['settings', 'סילבוס והגדרות'], ['roster', 'משתלמים'], ['templates', 'תבניות']];
  if (A.me && A.me.isSuper) tabs.push(['super', 'ניהול האתר']);
  return tabs;
}
function renderAdmin(keepScroll) {
  var v = adminView(), scroll = v.scrollTop;
  if (A.tab === 'super' && !(A.me && A.me.isSuper)) A.tab = 'track';
  var hasGroup = !!A.data;
  var tabs = tabsList().filter(function (x) { return hasGroup || x[0] === 'super'; });
  if (!hasGroup && A.tab !== 'super') A.tab = tabs.length ? (A.tab === 'super' ? 'super' : 'none') : 'none';
  var trial = A.me.status === 'trial' ? '<div class="trialbar">' + esc(t('תקופת ניסיון עד {d}.', { d: fmtStamp(A.me.trialEnd) })) + ' <button type="button" class="linkbtn" id="trialPay">' + t('פרטי מנוי ותשלום') + '</button></div>' : '';
  var top = topBarHtml(true) + trial + (tabs.length ? '<div class="tabs" role="tablist">' + tabs.map(function (x) {
    return '<button type="button" role="tab" data-tab="' + x[0] + '" aria-selected="' + (A.tab === x[0]) + '">' + t(x[1]) + '</button>';
  }).join('') + '</div>' : '') + '</div>';
  var main = '<div class="admin-main">';
  if (A.tab === 'super') main += tabSuper();
  else if (!hasGroup) {
    main += '<div class="card"><h3>' + t('עדיין אין קבוצות') + '</h3><p>' + t('צרו קבוצה ראשונה. אפשר להתחיל מהסילבוס המקורי, מתבנית, או לייבא קובץ סילבוס.') + '</p><button type="button" class="btn primary" id="admNew2" style="justify-self:start">' + ICON.plus + t('יצירת קבוצה') + '</button></div>';
  } else main += ({ track: tabTrack, stations: tabStations, settings: tabSettings, roster: tabRoster, templates: tabTemplates }[A.tab] || tabTrack)();
  main += footerHtml() + '</div>';
  var save = '<div class="savebar" id="saveBar"' + (A.dirty ? '' : ' hidden') + '><span><b>' + t('יש שינויים שלא נשמרו') + '</b></span><button type="button" class="btn primary" id="admSave">' + t('שמירת שינויים') + '</button><button type="button" class="btn" id="admDiscard">' + t('ביטול השינויים') + '</button></div>';
  v.innerHTML = top + main + save;
  if (keepScroll) v.scrollTop = scroll;
  bindTopBar(); bindFooter(v);
  var gs = $('#admGroup');
  if (gs) gs.onchange = function () {
    var to = gs.value;
    if (A.dirty) {
      gs.value = A.gid;
      confirmDialog(t('יש שינויים שלא נשמרו. לעבור קבוצה בלי לשמור?'), t('מעבר בלי שמירה'), true).then(function (ok) { if (ok) { A.dirty = false; loadGroup(to); } });
    } else loadGroup(to);
  };
  $('#admNew').onclick = openNewGroup;
  if ($('#admNew2')) $('#admNew2').onclick = openNewGroup;
  $('#admRefresh').onclick = function () { (A.gid ? loadGroup(A.gid) : loadOverview()).then(function () { toast(t('הנתונים עודכנו')); }); };
  if ($('#trialPay')) $('#trialPay').onclick = function () { var m = modal({ title: t('מנוי ותשלום') }); m.body.innerHTML = paymentBoxHtml(); bindPayment(m.body); };
  $all('[data-tab]', v).forEach(function (b) { b.onclick = function () { A.tab = b.getAttribute('data-tab'); renderAdmin(); v.scrollTop = 0; if (A.tab === 'super' && !A.sup) loadSuper(); }; });
  $('#admSave').onclick = saveDraft;
  $('#admDiscard').onclick = function () {
    confirmDialog(t('לבטל את כל השינויים שלא נשמרו?'), t('ביטול השינויים'), true).then(function (ok) {
      if (ok) { A.draft = JourneyCore.clone(A.data.group); A.dirty = false; renderAdmin(true); }
    });
  };
  if (A.tab === 'super') bindSuper();
  else if (hasGroup) ({ track: bindTrack, stations: bindStations, settings: bindSettings, roster: bindRoster, templates: bindTemplates }[A.tab] || bindTrack)();
}
function saveDraft() {
  var btn = $('#admSave'); btn.disabled = true; btn.textContent = t('שומר…');
  adminCall('adminSaveGroup', { groupId: A.gid, group: A.draft }).then(function (d) {
    A.data = d; A.draft = JourneyCore.clone(d.group); A.dirty = false;
    var ov = A.overview.groups.filter(function (g) { return g.id === A.gid; })[0];
    if (ov) ov.name = d.group.name;
    renderAdmin(true);
    toast(t('השינויים נשמרו. המשתלמים יראו אותם תוך חצי דקה.'));
  }).catch(function (e) { btn.disabled = false; btn.textContent = t('שמירת שינויים'); adminErr(e); });
}

/* ---------- עריכה גנרית ---------- */
function setPath(obj, path, val) {
  var parts = path.split('.');
  for (var i = 0; i < parts.length - 1; i++) obj = obj[parts[i]];
  obj[parts[parts.length - 1]] = val;
}
function readVal(el) {
  var kind = el.getAttribute('data-kind');
  if (el.type === 'checkbox') return el.checked;
  if (kind === 'num') return el.value === '' ? 0 : Number(el.value);
  if (kind === 'lines') return el.value.split('\n').map(function (x) { return x.trim(); }).filter(Boolean);
  return el.value;
}
function bindFields(root) {
  $all('[data-b]', root).forEach(function (el) {
    var ev = el.type === 'checkbox' || el.tagName === 'SELECT' ? 'change' : 'input';
    el.addEventListener(ev, function () {
      setPath(A.draft, el.getAttribute('data-b'), readVal(el));
      setDirty();
      if (el.hasAttribute('data-rr')) renderAdmin(true);
    });
  });
}
function fld(label, path, val, opts) {
  opts = opts || {};
  var id = 'f_' + path.replace(/\./g, '_');
  var attrs = ' id="' + id + '" data-b="' + path + '"' + (opts.kind ? ' data-kind="' + opts.kind + '"' : '') + (opts.dir ? ' dir="' + opts.dir + '"' : '') + (opts.rr ? ' data-rr' : '') + (opts.ph ? ' placeholder="' + esc(opts.ph) + '"' : '');
  var ctl;
  if (opts.type === 'textarea') ctl = '<textarea class="input"' + attrs + ' rows="' + (opts.rows || 3) + '">' + esc(opts.kind === 'lines' ? (val || []).join('\n') : val) + '</textarea>';
  else if (opts.type === 'select') ctl = '<select class="input"' + attrs + '>' + opts.options.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(val) ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select>';
  else if (opts.type === 'checkbox') return '<label class="check"><input type="checkbox"' + attrs + (val ? ' checked' : '') + '><span>' + esc(label) + (opts.help ? '<br><span class="small muted">' + esc(opts.help) + '</span>' : '') + '</span></label>';
  else ctl = '<input class="input" type="' + (opts.type || 'text') + '"' + attrs + ' value="' + esc(val) + '"' + (opts.min !== undefined ? ' min="' + opts.min + '"' : '') + (opts.max !== undefined ? ' max="' + opts.max + '"' : '') + '>';
  return '<div class="field"><label for="' + id + '">' + esc(label) + '</label>' + ctl + (opts.help ? '<span class="small muted">' + esc(opts.help) + '</span>' : '') + '</div>';
}
function groupLink(gid) { return location.origin + location.pathname + '?group=' + encodeURIComponent(gid); }

/* ---------- לשונית מעקב ---------- */
function cellFor(p, s, i) {
  var d = A.data;
  if (!d.open[i]) return { cls: 'l', txt: ICON.lock, csv: t('נעול') };
  var hasQuiz = s.quiz.questions.length > 0;
  if (!s.hasTask && !hasQuiz) return { cls: 'n', txt: '–', csv: '–' };
  var sub = d.subs.filter(function (x) { return x.email === p.email && x.stationId === s.id; })[0];
  var qr = d.quiz.filter(function (x) { return x.email === p.email && x.stationId === s.id; })[0];
  var q = hasQuiz ? (qr ? Number(qr.best) : null) : undefined;
  var okQuiz = !hasQuiz || (q !== null && q >= s.quiz.passScore);
  var ok = s.hasTask ? !!sub : okQuiz;
  var csv = (s.hasTask ? (sub ? t('הוגש') : t('לא הוגש')) : '') + (hasQuiz ? (s.hasTask ? ' / ' : '') + t('שאלון') + ' ' + (q === null ? t('לא נענה') : q) : '');
  return { cls: ok ? 'v' : 'x', txt: ok ? ICON.check : ICON.x, q: q, link: sub && sub.link, csv: csv };
}
function trackModel() {
  var d = A.data, g = d.group;
  var roster = d.roster.slice().sort(function (a, b) { return (a.name || a.email).localeCompare(b.name || b.email, LANG); });
  var colStats = g.stations.map(function (s, i) {
    if (!d.open[i] || (!s.hasTask && !s.quiz.questions.length)) return null;
    return { done: roster.filter(function (p) { return cellFor(p, s, i).cls === 'v'; }).length, total: roster.length };
  });
  return { g: g, roster: roster, colStats: colStats };
}
function tabTrack() {
  var d = A.data, M = trackModel(), g = M.g, roster = M.roster;
  var openCount = d.open.filter(Boolean).length, lastIdx = -1;
  M.colStats.forEach(function (c, i) { if (c && g.stations[i].hasTask) lastIdx = i; });
  var last = lastIdx >= 0 ? M.colStats[lastIdx] : null;
  var finals = d.subs.filter(function (x) { return x.stationId === 'final'; }).length;
  var rated = d.ratings.filter(function (r) { return r.count; });
  var avgAll = rated.length ? Math.round(rated.reduce(function (a, r) { return a + r.avg * r.count; }, 0) / rated.reduce(function (a, r) { return a + r.count; }, 0) * 10) / 10 : '–';
  var h = '<div class="grid3">' +
    '<div class="stat"><span class="v">' + roster.length + '</span><span class="k">' + t('משתלמים בקבוצה') + '</span></div>' +
    '<div class="stat"><span class="v">' + openCount + '/' + g.stations.length + '</span><span class="k">' + t('תחנות פתוחות') + '</span></div>' +
    '<div class="stat"><span class="v">' + (last ? last.done + '/' + last.total : '–') + '</span><span class="k">' + (last ? t('הגישו בתחנה {n}', { n: lastIdx + 1 }) : t('אין עדיין מטלה פתוחה')) + '</span></div>' +
    '<div class="stat"><span class="v">' + finals + '/' + roster.length + '</span><span class="k">' + t('הגישו מטלת סיום') + '</span></div>' +
    '<div class="stat"><span class="v">' + avgAll + '</span><span class="k">' + t('שביעות רצון ממוצעת') + '</span></div></div>';
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3>' + t('טבלת מעקב') + '</h3><div class="row">' +
    '<button type="button" class="btn sm" id="csvBtn">' + ICON.download + t('ייצוא ל-CSV') + '</button>' +
    '<button type="button" class="btn sm" id="csvCopy">' + ICON.copy + t('העתקת הטבלה') + '</button></div></div>' +
    '<div class="legend"><span><i class="cell v">' + ICON.check + '</i>' + t('הוגש / עבר') + '</span><span><i class="cell x">' + ICON.x + '</i>' + t('טרם הוגש') + '</span><span><i class="cell l">' + ICON.lock + '</i>' + t('נעול') + '</span><span><i class="cell n">–</i>' + t('אין מטלה') + '</span><span>' + t('המספר הקטן: הציון הגבוה בשאלון') + '</span></div>';
  if (!roster.length) h += '<p class="muted">' + t('אין עדיין משתלמים בקבוצה. הוסיפו אותם בלשונית "משתלמים".') + '</p>';
  else {
    h += '<div class="matrix-wrap"><table class="matrix"><thead><tr><th class="name">' + t('משתלם/ת') + '</th>' + g.stations.map(function (s, i) {
      var c = M.colStats[i];
      return '<th title="' + esc(s.title) + '">' + (i + 1) + (c ? '<br><span class="num" style="font-weight:600;color:var(--muted)">' + c.done + '/' + c.total + '</span>' : '') + '</th>';
    }).join('') + '<th>' + t('סיום') + '</th></tr></thead><tbody>' + roster.map(function (p) {
      return '<tr><td class="name" title="' + esc(p.email) + '">' + esc(p.name || p.email) + '<small dir="ltr">' + esc(p.email) + '</small></td>' + g.stations.map(function (s, i) {
        var c = cellFor(p, s, i);
        var inner = '<span class="cell ' + c.cls + '">' + c.txt + '</span>' + (c.q !== undefined && c.q !== null ? '<span class="cell-q">' + c.q + '</span>' : '');
        return '<td>' + (c.link ? '<a href="' + esc(safeHref(c.link)) + '" target="_blank" rel="noopener noreferrer" title="' + esc(t('פתיחת ההגשה')) + '">' + inner + '</a>' : inner) + '</td>';
      }).join('') + (function () {
        var f = d.subs.filter(function (x) { return x.email === p.email && x.stationId === 'final'; })[0];
        var inner = '<span class="cell ' + (f ? 'v' : 'x') + '">' + (f ? ICON.check : ICON.x) + '</span>';
        return '<td>' + (f ? '<a href="' + esc(safeHref(f.link)) + '" target="_blank" rel="noopener noreferrer">' + inner + '</a>' : inner) + '</td>';
      })() + '</tr>';
    }).join('') + '</tbody><tfoot><tr><td class="name"><b>' + t('דירוג ממוצע') + '</b></td>' + d.ratings.map(function (r) {
      return '<td class="num small">' + (r.count ? '<b>' + r.avg + '</b><span class="cell-q">' + t('{c} הצבעות', { c: r.count }) + '</span>' : '–') + '</td>';
    }).join('') + '<td></td></tr></tfoot></table></div>';
    var choices = g.stations.map(function (s, i) { return M.colStats[i] ? '<option value="' + i + '">' + esc(t('תחנה {n}', { n: i + 1 }) + ': ' + s.title) + '</option>' : ''; }).join('');
    h += '<div class="row"><label class="lbl" for="missSel">' + t('מי טרם הגיש:') + '</label><select id="missSel" class="input" style="width:auto;max-width:100%;flex:1;min-width:200px">' + choices + '<option value="final">' + t('מטלת הסיום') + '</option></select>' +
      '<button type="button" class="btn sm" id="missCopy">' + ICON.copy + t('העתקת רשימה לתזכורת') + '</button></div>';
  }
  return h + '</div>';
}
/* תא CSV: מנטרל נוסחאות (=,+,-,@) כדי ש-Excel לא יריץ אותן */
function csvCell(c) {
  c = String(c === undefined || c === null ? '' : c);
  if (/^[=+\-@\t\r]/.test(c)) c = "'" + c;
  return /[",\n\t]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
}
function buildRows() {
  var d = A.data, M = trackModel(), g = M.g;
  var head = [t('שם'), t('מייל')].concat(g.stations.map(function (s, i) { return t('תחנה {n}', { n: i + 1 }); }), [t('מטלת סיום')]);
  var rows = M.roster.map(function (p) {
    var f = d.subs.filter(function (x) { return x.email === p.email && x.stationId === 'final'; })[0];
    return [p.name, p.email].concat(g.stations.map(function (s, i) { return cellFor(p, s, i).csv; }), [f ? t('הוגש') : t('לא הוגש')]);
  });
  rows.push([t('דירוג ממוצע'), ''].concat(d.ratings.map(function (r) { return r.count ? r.avg + ' (' + r.count + ')' : ''; }), ['']));
  return [head].concat(rows);
}
function bindTrack() {
  var csvBtn = $('#csvBtn');
  if (csvBtn) csvBtn.onclick = function () {
    var text = buildRows().map(function (r) { return r.map(csvCell).join(','); }).join('\r\n');
    var blob = new Blob(['\ufeff' + text], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (A.data.group.name || 'group').replace(/[\\/:*?"<>|]/g, '') + '.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast(t('הקובץ ירד. אם לא, השתמשו ב"העתקת הטבלה" והדביקו ב-Excel.'));
  };
  var cp = $('#csvCopy');
  if (cp) cp.onclick = function () { copyText(buildRows().map(function (r) { return r.map(function (c) { return csvCell(c).replace(/\t/g, ' '); }).join('\t'); }).join('\n'), t('הטבלה הועתקה. אפשר להדביק ב-Excel או ב-Sheets.')); };
  var mc = $('#missCopy');
  if (mc) mc.onclick = function () {
    var val = $('#missSel').value, d = A.data, M = trackModel(), list;
    if (val === 'final') list = M.roster.filter(function (p) { return !d.subs.some(function (x) { return x.email === p.email && x.stationId === 'final'; }); });
    else { var i = Number(val), s = d.group.stations[i]; list = M.roster.filter(function (p) { return cellFor(p, s, i).cls !== 'v'; }); }
    if (!list.length) { toast(t('כולם הגישו')); return; }
    copyText(list.map(function (p) { return (p.name ? p.name + ' ' : '') + '<' + p.email + '>'; }).join('\n'), t('הועתקו {n} שמות. אפשר להדביק במייל.', { n: list.length }));
  };
}

function blankStation(id, n) {
  return { id: id, title: t('מפגש {n}', { n: n }), date: '', start: '18:30', end: '21:00', type: 'sync', location: '', hours: 3, desc: '', mode: 'auto', requirements: [], hasTask: false, requirePadlet: true, submitHint: '', badge: false, badgeName: '', items: [], quiz: { passScore: 60, questions: [] } };
}
function optionList(q) {
  return q.options.map(function (o, oi) { return '<option value="' + oi + '"' + (oi === q.correct ? ' selected' : '') + '>' + (oi + 1) + '. ' + esc(o) + '</option>'; }).join('') || '<option value="0">' + t('כתבו תשובות קודם') + '</option>';
}
function bindStations() {
  var v = adminView(), g = A.draft;
  $all('details.st-row', v).forEach(function (d) {
    d.addEventListener('toggle', function () {
      var id = d.getAttribute('data-sid');
      if (d.open && !A.openSt[id]) { A.openSt[id] = true; renderAdmin(true); } else if (!d.open && A.openSt[id]) delete A.openSt[id];
    });
  });
  $all('[data-mode]', v).forEach(function (b) {
    b.onclick = function (e) { e.preventDefault(); e.stopPropagation(); g.stations[+b.getAttribute('data-i')].mode = b.getAttribute('data-mode'); setDirty(); renderAdmin(true); };
  });
  bindFields(v);
  $all('[data-opts]', v).forEach(function (ta) {
    ta.addEventListener('input', function () {
      var pr = ta.getAttribute('data-opts').split(':'), q = g.stations[+pr[0]].quiz.questions[+pr[1]];
      if (q.correct >= q.options.length) q.correct = 0;
      $('#qc_' + pr[0] + '_' + pr[1]).innerHTML = optionList(q);
    });
  });
  $('#stCount').onchange = function () {
    var want = Number(this.value), cur = g.stations.length;
    if (want > cur) {
      for (var k = cur; k < want; k++) g.stations.push(blankStation('s' + rand6(), k + 1));
      setDirty(); renderAdmin(true); toast(t('נוספו {n} מפגשים בסוף הרשימה', { n: want - cur }));
      return;
    }
    if (want === cur) return;
    var gone = g.stations.slice(want);
    var withWork = gone.filter(function (st) { return A.data.subs.some(function (x) { return x.stationId === st.id; }) || A.data.quiz.some(function (x) { return x.stationId === st.id; }); });
    var msg = t('למחוק את {n} המפגשים האחרונים: {list}?', { n: cur - want, list: gone.map(function (st) { return '"' + st.title + '"'; }).join(', ') }) +
      (withWork.length ? ' ' + t('שימו לב: ב-{n} מהם כבר יש הגשות או ציונים. הם יישארו בגיליון, אבל לא יוצגו.', { n: withWork.length }) : '');
    this.value = cur;
    confirmDialog(msg, t('מחיקה'), true).then(function (ok) { if (ok) { g.stations.splice(want); setDirty(); renderAdmin(true); } });
  };
  $('#stAdd').onclick = function () {
    var id = 's' + rand6();
    g.stations.push(blankStation(id, g.stations.length + 1));
    A.openSt[id] = true; setDirty(); renderAdmin(true);
    var el = $('[data-sid="' + id + '"]', v); if (el) el.scrollIntoView({ block: 'center' });
  };
  function on(attr, fn) { $all('[' + attr + ']', v).forEach(function (b) { b.onclick = function () { fn.apply(null, b.getAttribute(attr).split(':').map(Number)); }; }); }
  on('data-itadd', function (i) { g.stations[i].items.push({ id: 'i' + rand6(), type: 'link', title: '', url: '' }); setDirty(); renderAdmin(true); });
  on('data-itdel', function (i, k) { g.stations[i].items.splice(k, 1); setDirty(); renderAdmin(true); });
  on('data-itmv', function (i, k, dir) { var arr = g.stations[i].items, j = k + dir; if (j < 0 || j >= arr.length) return; var x = arr[k]; arr[k] = arr[j]; arr[j] = x; setDirty(); renderAdmin(true); });
  on('data-qadd', function (i) { g.stations[i].quiz.questions.push({ q: '', options: [], correct: 0 }); setDirty(); renderAdmin(true); });
  on('data-qdel', function (i, k) { g.stations[i].quiz.questions.splice(k, 1); setDirty(); renderAdmin(true); });
  on('data-stmv', function (i, dir) { var arr = g.stations, j = i + dir; if (j < 0 || j >= arr.length) return; var x = arr[i]; arr[i] = arr[j]; arr[j] = x; setDirty(); renderAdmin(true); });
  on('data-stdel', function (i) {
    confirmDialog(t('למחוק את התחנה "{n}"? ההגשות שלה יישארו בגיליון, אבל לא יוצגו.', { n: g.stations[i].title }), t('מחיקה'), true).then(function (ok) {
      if (ok) { g.stations.splice(i, 1); setDirty(); renderAdmin(true); }
    });
  });
}

/* --- קריאת קובץ משתלמים (Excel / CSV) --- */
var HEAD = {
  email: /mail|מייל|דוא"?ל|דואל|אימייל|بريد|إيميل|ايميل/i,
  full: /^(full ?name|name|שם|שם מלא|اسم|الاسم|الاسم الكامل)$/i,
  first: /first|פרטי|الاسم الأول|الأول/i,
  last: /last|משפחה|العائلة|عائلة/i
};
function parseRosterRows(rows, withHeader) {
  rows = rows.map(function (r) { return r.map(function (c) { return String(c === undefined || c === null ? '' : c).trim(); }); }).filter(function (r) { return r.join('').trim(); });
  var hi = -1, col = {};
  if (withHeader) {
    for (var i = 0; i < Math.min(5, rows.length); i++) {
      var r = rows[i], c = {};
      r.forEach(function (cell, j) {
        if (c.email === undefined && HEAD.email.test(cell)) c.email = j;
        else if (c.full === undefined && HEAD.full.test(cell)) c.full = j;
        else if (c.first === undefined && HEAD.first.test(cell)) c.first = j;
        else if (c.last === undefined && HEAD.last.test(cell)) c.last = j;
      });
      if (c.email !== undefined) { hi = i; col = c; break; }
    }
  }
  var out = [], bad = [], dup = 0, seen = {};
  rows.slice(hi + 1).forEach(function (r) {
    var email = col.email !== undefined ? r[col.email] : r.filter(function (x) { return x.indexOf('@') >= 0; })[0];
    email = JourneyCore.normEmail(email);
    if (!email || !JourneyCore.isEmail(email)) { bad.push(r.join(' ').slice(0, 60)); return; }
    var name;
    if (col.full !== undefined) name = r[col.full];
    else if (col.first !== undefined || col.last !== undefined) name = [r[col.first], r[col.last]].filter(Boolean).join(' ');
    else name = r.filter(function (x) { return x && x.indexOf('@') < 0 && !/^\d+$/.test(x); }).join(' ');
    if (seen[email]) { dup++; return; }
    seen[email] = 1;
    out.push({ email: email, name: (name || '').trim() });
  });
  return { rows: out, bad: bad, dup: dup };
}
function loadSheetJs() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = function () { resolve(window.XLSX); };
    s.onerror = function () { reject({ error: t('לא הצלחתי לטעון את קורא קובצי ה-Excel. שמרו את הקובץ כ-CSV ונסו שוב.') }); };
    document.head.appendChild(s);
  });
}
function importRosterFile(file) {
  var isCsv = /\.(csv|txt)$/i.test(file.name);
  var p = isCsv
    ? file.text().then(function (txt) {
      var delim = (txt.split('\n')[0].match(/\t/) ? '\t' : txt.split('\n')[0].match(/;/) && !txt.split('\n')[0].match(/,/) ? ';' : ',');
      return txt.replace(/^\ufeff/, '').split(/\r?\n/).map(function (l) { return l.split(delim).map(function (c) { return c.replace(/^"|"$/g, ''); }); });
    })
    : Promise.all([loadSheetJs(), file.arrayBuffer()]).then(function (x) {
      var wb = x[0].read(x[1], { type: 'array' });
      return x[0].utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
    });
  p.then(function (rows) {
    var res = parseRosterRows(rows, true);
    var m = modal({ title: t('תצוגה מקדימה: {f}', { f: file.name }), wide: true });
    m.body.innerHTML = '<div class="box ' + (res.rows.length ? 'okbox' : '') + '"><b>' + esc(t('נמצאו {n} משתלמים עם מייל תקין.', { n: res.rows.length })) + '</b>' +
      (res.bad.length ? '<p class="small">' + esc(t('{n} שורות בלי מייל תקין ידולגו.', { n: res.bad.length })) + '</p>' : '') +
      (res.dup ? '<p class="small">' + esc(t('{n} כפילויות הוסרו.', { n: res.dup })) + '</p>' : '') + '</div>' +
      (res.rows.length ? '<div class="tbl-wrap" style="max-height:40vh;overflow:auto"><table class="tbl"><thead><tr><th>#</th><th>' + t('שם') + '</th><th>' + t('מייל') + '</th></tr></thead><tbody>' +
        res.rows.map(function (r, i) { return '<tr><td class="num">' + (i + 1) + '</td><td>' + esc(r.name || '—') + '</td><td dir="ltr" style="text-align:right">' + esc(r.email) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '') +
      '<div class="row">' + (res.rows.length ? '<button type="button" class="btn primary" id="rfAdd">' + t('הוספה לרשימה הקיימת') + '</button><button type="button" class="btn" id="rfReplace">' + t('החלפת כל הרשימה') + '</button>' : '') +
      '<button type="button" class="btn ghost" id="rfCancel">' + t('ביטול') + '</button></div>';
    $('#rfCancel', m.body).onclick = m.close;
    if (res.rows.length) {
      $('#rfAdd', m.body).onclick = function () { var x = mergeRoster(res.rows, false); m.close(); saveRoster(x.list, t('נוספו {n} משתלמים', { n: x.added })).catch(adminErr); };
      $('#rfReplace', m.body).onclick = function () {
        confirmDialog(t('להחליף את כל הרשימה? משתלמים שלא מופיעים בקובץ יוסרו מהקבוצה.'), t('החלפה'), true).then(function (ok) {
          if (ok) { m.close(); saveRoster(res.rows, t('הרשימה הוחלפה')).catch(adminErr); }
        });
      };
    }
  }).catch(function (e) { toast(errMsg(e && e.error ? e : { error: t('לא הצלחתי לקרוא את הקובץ.') }), 6000); });
}
